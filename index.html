<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GATE CSE Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <!-- Header -->
        <div class="header">
            <h1>🚀 GATE CSE Quiz</h1>
            <p>Test Your CSE Knowledge</p>
        </div>

        <!-- Question Information -->
        <div class="quiz-info">

            <span id="question-number">
                Question 1 of 10
            </span>

            <span id="timer">
                ⏱️ 30
            </span>

        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <!-- Question -->
        <div class="question-box">

            <h2 id="question">
                Question will appear here
            </h2>

        </div>

        <!-- Options -->
        <div class="options">

            <button class="option-btn">Option 1</button>

            <button class="option-btn">Option 2</button>

            <button class="option-btn">Option 3</button>

            <button class="option-btn">Option 4</button>

        </div>

        <!-- Next Button -->
        <button id="next-btn">
            Next ➡️
        </button>

        <!-- Score -->
        <p id="score">
            Score: 0
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
